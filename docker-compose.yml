services:
  auth:
    build: .
    container_name: auth-service
    ports:
      - "8001:8001"
    environment:
      - AUTH_SERVICE_PORT=8001
      - AUTH_SERVICE_HOST=0.0.0.0
      - JWT_SECRET_KEY=super-secret-key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=1440
      - TEST_USERNAME=testuser
      - TEST_PASSWORD=testpass
    volumes:
      - ./services:/app/services
    command: python -m uvicorn services.auth:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - research-network

networks:
  research-network:
    driver: bridge